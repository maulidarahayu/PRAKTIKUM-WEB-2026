<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial-scale=1.0">
    <title>Pertemuan 6-API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Daftar Pengguna</h2>
        <p class="Subtitle">Praktikum Ascyncronous Javascript & Ferching API</p>

    </div>
